[project]
name = "codex-desktop-bridge"
version = "0.3.0"
description = "Background Windows Codex Desktop inspection and guarded chat navigation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marchellino Ghorayeb" }]
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]
keywords = ["mcp", "model-context-protocol", "claude-code", "codex", "multi-agent", "agent-to-agent", "ui-automation", "windows"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/HoppeStudios/codex-desktop-bridge"
Issues = "https://github.com/HoppeStudios/codex-desktop-bridge/issues"

[project.scripts]
codex-desktop-bridge = "agent_bridge:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent_bridge", "transcripts"]
